name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase URL
        run: |
          # 尝试直接访问你的网址，即使返回 404 错误也不让 GitHub 判定为失败
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}" || true
