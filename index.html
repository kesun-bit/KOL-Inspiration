<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreatorLook</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f8f8f7',
            paper2: '#f3f3f2',
            surface: '#ffffff',
            ink: '#3f3f3f',
            deep: '#2f2f2f',
            wash: '#ececeb',
            line: 'rgba(0,0,0,0.08)',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            card: '0 6px 24px rgba(0,0,0,0.06)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      background: linear-gradient(180deg, #fafaf9 0%, #f4f4f3 100%);
    }
    .page-shell { width: 100%; padding-left: 12px; padding-right: 12px; }
    @media (min-width: 640px) { .page-shell { padding-left: 16px; padding-right: 16px; } }
    @media (min-width: 1024px) { .page-shell { padding-left: 20px; padding-right: 20px; } }

    .masonry { column-count: 2; column-gap: 12px; }
    @media (min-width: 640px) { .masonry { column-count: 3; column-gap: 14px; } }
    @media (min-width: 768px) { .masonry { column-count: 4; } }
    @media (min-width: 1024px) { .masonry { column-count: 5; column-gap: 16px; } }
    @media (min-width: 1280px) { .masonry { column-count: 6; } }
    @media (min-width: 1536px) { .masonry { column-count: 7; } }
    .masonry-item { break-inside: avoid; margin-bottom: 12px; }

    .tab-segment .main-tab {
      padding: 8px 18px;
      border-radius: 999px;
      color: #7a7a7a;
      font-size: 13px;
      font-weight: 500;
      transition: all .2s ease;
    }
    .tab-segment .main-tab.tab-active {
      background: #fff;
      color: #3f3f3f;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    .filter-scroll { -ms-overflow-style: none; scrollbar-width: none; gap: 22px; }
    #filter-inspiration.filter-scroll,
    #filter-ai.filter-scroll,
    #filter-creative.filter-scroll { overflow: visible; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-link {
      position: relative;
      color: #6f6f6f;
      padding: 8px 4px;
      font-size: 13px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: color .2s ease;
    }
    .filter-link:hover { color: #3f3f3f; }
    .filter-link-active {
      color: #2f2f2f;
      font-weight: 600;
    }
    .filter-link-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 2px;
      border-radius: 2px;
      background: #2f2f2f;
    }

    .btn-godly {
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      font-size: 13px;
      font-weight: 600;
      transition: all .2s ease;
    }
    .btn-godly:hover { background: #ececeb; }
    .btn-godly-primary {
      background: #3a3a3a;
      border-color: #3a3a3a;
      color: #fff;
    }
    .btn-godly-primary:hover { background: #2f2f2f; border-color: #2f2f2f; }

    .morandi-tag {
      display: inline-flex;
      align-items: center;
      background: #e5e5e2;
      color: #474747;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .media-card {
      border-radius: 20px;
      overflow: hidden;
      background: #f0f0ef;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      transition: transform .35s cubic-bezier(.16,1,.3,1);
    }
    .media-card:hover { transform: translateY(-2px); }
    .media-card img { transition: transform .6s cubic-bezier(.16,1,.3,1); }
    .media-card:hover img { transform: scale(1.03); }
    .context-menu {
      position: fixed;
      z-index: 70;
      min-width: 140px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.12);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      padding: 6px;
    }
    .context-menu-item {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #3f3f3f;
      transition: background .15s ease;
    }
    .context-menu-item:hover { background: #f2f2f2; }

    .kol-card {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 26px rgba(0,0,0,.08);
      background: #fff;
    }
    .kol-image { aspect-ratio: 4/5; background: #efefee; overflow: hidden; position: relative; }
    .kol-image img { width: 100%; height: 100%; object-fit: cover; }
    .kol-overlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 16px 14px 14px;
      background: linear-gradient(to top, rgba(0,0,0,.52) 0%, rgba(0,0,0,.28) 55%, transparent 100%);
      color: #fff;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }
    .kol-card:hover .kol-overlay,
    .kol-card:focus-within .kol-overlay {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .kol-name { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .kol-desc { margin-top: 6px; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .kol-followers {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: rgba(255,255,255,.92);
    }
    .kol-profile-link {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, opacity .2s ease;
    }
    .kol-profile-link:hover { opacity: .86; transform: translateX(1px); }

    .header-search {
      position: relative;
      flex-shrink: 1;
      min-width: 0;
      max-width: 220px;
    }
    .header-search input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.1);
      background: #ececeb;
      font-size: 13px;
      color: #3f3f3f;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .header-search input:focus {
      border-color: rgba(0,0,0,.18);
      box-shadow: 0 0 0 3px rgba(0,0,0,.04);
    }
    .header-search .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a8a8a;
      pointer-events: none;
    }

    .lightbox-enter { animation: fade .3s ease; }
    @keyframes fade { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1);} }
    #lightbox.soft-lightbox {
      background: rgba(255,255,255,.68) !important;
      backdrop-filter: blur(18px) saturate(1.05);
    }
    #lightbox.soft-lightbox #lightbox-image-wrap {
      background: transparent !important;
      border-radius: 0;
      overflow: visible;
    }
    #lightbox.soft-lightbox #lightbox-img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 18px 56px rgba(0,0,0,.14);
    }
    #lightbox.soft-lightbox #lightbox-close {
      background: rgba(255,255,255,.72);
      color: #2f2f2f;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    #lightbox.soft-lightbox #lightbox-close:hover { background: #fff; }
    #lightbox.soft-lightbox #lightbox-sidebar,
    #lightbox.soft-lightbox #lightbox-sidebar-mobile {
      background: rgba(255,255,255,.74) !important;
      color: #2f2f2f !important;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 18px 56px rgba(0,0,0,.1);
      backdrop-filter: blur(18px);
      height: var(--lightbox-image-height, auto) !important;
      max-height: var(--lightbox-image-height, 82vh) !important;
    }
    #lightbox.soft-lightbox #lightbox-sidebar p,
    #lightbox.soft-lightbox #lightbox-sidebar-mobile p { color: rgba(47,47,47,.86) !important; }
    #lightbox.soft-lightbox [data-i18n="promptLabel"] { color: rgba(47,47,47,.45) !important; }
    #lightbox.soft-lightbox .lightbox-tag { background: rgba(0,0,0,.06); color: rgba(47,47,47,.72); }

    .subheader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
    }
    .btn-upload {
      flex-shrink: 0;
      height: 36px;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #2f2f2f;
      transition: opacity .2s ease;
    }
    .btn-upload:hover { opacity: .7; }
    .web-filter-select-wrap { position: relative; display: inline-flex; flex: 0 0 auto; }
    .web-filter-select-wrap select.filter-link {
      appearance: auto;
      -webkit-appearance: menulist;
      height: 36px;
      min-width: 104px;
      max-width: 148px;
      padding-right: 8px;
      cursor: pointer;
      background: transparent;
      outline: none;
    }
    .creative-chip-row { gap: 8px; }
    .creative-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 14px;
      border-radius: 999px;
      background: #ececeb;
      color: #77736d;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .16s ease, color .16s ease;
    }
    .creative-chip:hover,
    .creative-chip.is-active { background: #2f2f2f; color: #fff; }
    .creative-region-dropdown { position: relative; flex: 0 0 auto; }
    .creative-region-summary {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #2f2f2f;
      padding: 8px 4px;
      font-size: 13px;
      line-height: 1;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .creative-region-summary::-webkit-details-marker { display: none; }
    .creative-region-summary::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 1px;
      background: currentColor;
    }
    .creative-region-caret { transition: transform .16s ease; color: #6f6f6f; }
    .creative-region-dropdown[open] .creative-region-caret { transform: rotate(180deg); }
    .creative-region-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 60;
      min-width: 142px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      background: #fff;
      box-shadow: 0 14px 34px rgba(0,0,0,.14);
    }
    .creative-region-option {
      width: 100%;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      color: #2f2f2f;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }
    .creative-region-option:hover,
    .creative-region-option.is-active { background: #f0f0ef; }
    .multi-filter-dropdown { position: relative; flex: 0 0 auto; }
    .multi-filter-summary {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #6f6f6f;
      padding: 8px 4px;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color .2s ease;
    }
    .multi-filter-dropdown[open] .multi-filter-summary,
    .multi-filter-summary.is-active,
    .multi-filter-summary:hover { color: #3f3f3f; }
    .multi-filter-summary.is-active { color: #2f2f2f; font-weight: 600; }
    .multi-filter-summary.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 1px;
      background: currentColor;
    }
    .multi-filter-summary::-webkit-details-marker { display: none; }
    .multi-filter-label { max-width: none; overflow: visible; text-overflow: clip; white-space: nowrap; }
    .multi-filter-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 60;
      width: 180px;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.08);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .multi-filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 13px;
      color: #4d4b47;
      cursor: pointer;
    }
    .multi-filter-option:hover { background: #f2f2f2; }
    .multi-filter-option input { accent-color: #2f2f2f; }
    .web-upload-select-wrap { position: relative; }
    .web-upload-select {
      width: 100%;
      height: 46px;
      padding: 0 82px 0 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.1);
      background: #ececeb;
      color: #3f3f3f;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .web-upload-select-wrap::after {
      content: '⌄';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #4b4b4b;
      pointer-events: none;
    }
    .web-upload-select-label {
      position: absolute;
      left: 14px;
      right: 82px;
      top: 50%;
      transform: translateY(-50%);
      color: #3f3f3f;
      font-size: 14px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .web-upload-select.is-multi-count { color: transparent; text-shadow: none; }
    .web-upload-select.is-multi-count option { color: #3f3f3f; }
    .web-option-manager {
      position: absolute;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .web-option-manager.is-collapsed { display: inline-flex; }
    .web-option-manager input { display: none; }
    .web-option-add,
    .web-option-remove,
    .web-select-action {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.72);
      color: #3f3f3f;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .web-select-action {
      position: absolute;
      top: 50%;
      z-index: 2;
      transform: translateY(-50%);
    }
    .web-select-add { right: 58px; }
    .web-select-remove { right: 32px; }
    .web-option-add:hover,
    .web-option-remove:hover,
    .web-select-action:hover { background: #2f2f2f; color: #fff; }

    .lightbox-tag {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.88);
      line-height: 1.2;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #3f3f3f;
      transition: background .15s ease, opacity .15s ease;
    }
    .icon-btn:hover { background: #ececeb; }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
    }
    .fav-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 auto;
    }
    .media-card:hover .fav-btn,
    .kol-image:hover .fav-btn,
    .fav-btn.is-active { opacity: 1; }
    .fav-btn:hover { transform: scale(1.06); }

    .user-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 220px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.1);
      background: #fff;
      box-shadow: 0 12px 36px rgba(0,0,0,.12);
      padding: 8px;
      z-index: 50;
    }
    .user-menu-item {
      width: 100%;
      text-align: left;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      color: #3f3f3f;
      transition: background .15s ease;
    }
    .user-menu-item:hover { background: #f2f2f2; }
    .user-menu-divider { height: 1px; background: rgba(0,0,0,.08); margin: 6px 4px; }

    .lang-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.1);
      background: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,.1);
      padding: 6px;
      z-index: 50;
      min-width: 120px;
    }
    .lang-option {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .lang-option:hover { background: #f2f2f2; }
    .lang-option-active { background: #ececeb; color: #2f2f2f; }
    .lang-toggle-btn { gap: 4px; width: auto; padding: 0 9px; font-size: 11px; font-weight: 700; }

    .favorites-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw);
      background: #fff;
      z-index: 55;
      box-shadow: -8px 0 32px rgba(0,0,0,.12);
      transform: translateX(100%);
      transition: transform .3s ease;
    }
    .favorites-drawer.open { transform: translateX(0); }
    .fav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fav-thumb { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #efefee; }
    .fav-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .fav-select-box {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      border: 1.5px solid rgba(255,255,255,.88);
      background: rgba(0,0,0,.26);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: background .16s ease, color .16s ease;
    }
    .fav-select-box input { position: absolute; opacity: 0; pointer-events: none; }
    .fav-select-box:has(input:checked) { background: #2f2f2f; color: #fff; }
    .fav-select-box svg { width: 17px; height: 17px; stroke-width: 2.4; }

    .header-top-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px 12px;
    }
    .header-top-center { justify-self: center; }
    .header-top-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .drop-zone {
      position: relative;
      min-height: 148px;
      border-radius: 16px;
      border: 1.5px dashed rgba(0,0,0,.16);
      background: #f3f3f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color .2s ease, background .2s ease;
    }
    .drop-zone:hover, .drop-zone:focus-visible { border-color: rgba(0,0,0,.28); background: #ececeb; }
    .drop-zone.is-dragover { border-color: #3f3f3f; background: #e8e8e6; }
    .drop-zone.has-image { border-style: solid; border-color: rgba(0,0,0,.1); padding: 0; min-height: 0; }
    .drop-zone-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 20px;
      text-align: center;
      pointer-events: none;
    }
    .drop-zone.has-image .drop-zone-empty { display: none; }
    .drop-zone-hint { font-size: 12px; color: #7a7a7a; line-height: 1.4; max-width: 220px; }
    .drop-zone-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }
    .drop-zone.has-image .drop-zone-preview { display: block; }

    .sr-only {

      height: 1px;

    function buildCreativeSearchTags(item) {

    function postToKol(row) {
      const m = row.metadata || {};
      const kol = {
        id: row.id,
        name: row.title || '',
        followers: row.fans || '',
        account: m.account || '',
        gender: m.gender || '女',
        region: m.region || '',
        ethnicity: normalizeKolEthnicity(m.ethnicity),
        accountType: m.accountType || '',
        image: row.image_url,
        storagePath: row.storage_path || '',
        searchTags: Array.isArray(m.searchTags) ? m.searchTags : [],
      };
      if (!kol.searchTags.length) kol.searchTags = buildKolSearchTags(kol);
      return kol;
    }

    function postToMedia(row) {
      const m = row.metadata || {};
      const item = {
        id: row.id,
        image: row.category === 'ai_model' ? (m.afterImage || m.beforeImage || row.image_url) : row.image_url,
        mainImage: row.image_url,
        beforeImage: m.beforeImage || '',
        afterImage: m.afterImage || '',
        beforeStoragePath: m.beforeStoragePath || '',
        afterStoragePath: m.afterStoragePath || '',
        displayMode: m.displayMode || ((m.beforeImage || m.afterImage) ? 'compare' : 'single'),
        category: m.subcategory || m.category || '美颜类',
        creativeRegion: m.creativeRegion || (CREATIVE_REGIONS.includes(m.subcategory || m.category) ? (m.subcategory || m.category) : ''),
        detailCategory: m.detailCategory || '',
        style: m.style || '',
        prompt: m.prompt || m.style || '',
        tags: Array.isArray(m.tags) ? m.tags : [],
        webTags: m.webTags || {},
        aiTags: m.aiTags || {},
        searchTags: Array.isArray(m.searchTags) ? m.searchTags : [],
        storagePath: row.storage_path || '',
      };
      if (row.category === 'net_model' && !item.searchTags.length) item.searchTags = buildInspirationSearchTags(item);
      if (row.category === 'inspiration' && !item.searchTags.length) item.searchTags = buildCreativeSearchTags(item);
      if (row.category === 'ai_model') {
        item.prompt = m.prompt || item.style || '';
        if (!item.tags.length) item.tags = buildAiTags(item.style, item.category);
      }
      return item;
    }

    function applyPostsToState(rows) {

    function toSupabaseUrl(row) {
      const raw = row?.image_url || row?.imageUrl || '';
      if (!raw) return '';
      if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;
      return `${SUPABASE_STORAGE_BASE}/${String(raw).replace(/^\/+/, '')}`;

    function withCacheBust(url) {
      if (!url || typeof url !== 'string' || url.startsWith('data:')) return url;
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}v=${Date.now()}`;
    }

    function verifyImageUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          reject(new Error('image verify timeout'));
        }, 12000);
        img.onload = () => {
          clearTimeout(timer);
          resolve(true);
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error('image verify failed'));
        };
        img.src = withCacheBust(url);
      });
    }

    async function uploadImageToStorage(file, category = 'uploads') {
      const { data: { user } } = await SUPABASE.auth.getUser();
      const uploaderId = user?.id || 'guest';
      const ext = (file.name?.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/gi, '') || 'jpg';
      const filePath = `${category}/${uploaderId}/${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await SUPABASE.storage.from(SUPABASE_BUCKET).upload(filePath, file, {
        cacheControl: 'no-cache',
        upsert: false,
        contentType: file.type || 'image/jpeg',
      });
      if (uploadError) throw uploadError;
      const { data } = SUPABASE.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
      return { imageUrl: withCacheBust(data.publicUrl), storagePath: filePath, provider: 'supabase' };
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('read'));
        reader.readAsDataURL(file);
      });
    }

    async function uploadOrUseLocalImage(file, category = 'uploads') {
      if (SUPABASE_READY) {
        try {
          return await uploadImageToStorage(file, category);
        } catch (err) {
          console.error('remote image upload failed', err);
          throw new Error(appMeta.lang === 'en' ? 'Image upload failed. Please try again.' : '图片上传失败，请重试。');
        }
      }
      return { imageUrl: await fileToDataUrl(file), storagePath: '', provider: 'local' };
    }

    async function deleteStorageFile(storagePath) {
      if (!storagePath) return;
      const { error } = await SUPABASE.storage.from(SUPABASE_BUCKET).remove([storagePath]);
      if (error) console.warn('storage delete', error);
    }

    async function insertPost({ category, title, fans, imageUrl, storagePath, metadata }) {
      const { data: { user } } = await SUPABASE.auth.getUser();
      const payload = {
        image_url: imageUrl,
        storage_path: storagePath || null,
        title: title || null,
        fans: fans || null,
        category,
        metadata: metadata || {},
        created_by: user?.id || null,
      };
      const { data, error } = await SUPABASE.from(SUPABASE_POSTS_TABLE).insert(payload).select().single();
      if (error) throw error;
      return data;
    }

    function createLocalPost({ category, title, fans, imageUrl, storagePath, metadata }) {
      const now = new Date().toISOString();
      const row = {
        id: `local-${crypto.randomUUID()}`,
        image_url: imageUrl,
        storage_path: storagePath || null,
        title: title || null,
        fans: fans || null,
        category,
        metadata: metadata || {},
        created_at: now,
        created_by: null,
      };
      postsStore.unshift(row);
      savePostsStore();
      addPostToState(row);
      return row;
    }

    async function savePost({ id, category, title, fans, imageUrl, storagePath, metadata }) {
      if (!SUPABASE_READY) {
        if (id) {
          const row = postsStore.find((post) => post.id === id);
          if (row) {
            Object.assign(row, { image_url: imageUrl, storage_path: storagePath || null, title: title || null, fans: fans || null, metadata: metadata || {} });
            savePostsStore();
            replacePostInState(row);
            return row;
          }
        }
        return createLocalPost({ category, title, fans, imageUrl, storagePath, metadata });
      }
      try {
        return id
          ? await updatePost({ id, title, fans, imageUrl, storagePath, metadata })
          : await insertPost({ category, title, fans, imageUrl, storagePath, metadata });
      } catch (err) {
        console.warn('remote post save failed; using local fallback', err);
        return id ? updateLocalPost({ id, title, fans, imageUrl, storagePath, metadata }) : createLocalPost({ category, title, fans, imageUrl, storagePath, metadata });
      }
    }

    function updateLocalPost({ id, title, fans, imageUrl, storagePath, metadata }) {
      const row = postsStore.find((post) => post.id === id);
      if (!row) return createLocalPost({ category: POST_CATEGORIES[getActiveTab()] || 'kol', title, fans, imageUrl, storagePath, metadata });

    function compressImageFile(file, maxW = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('decode'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('read'));
        reader.readAsDataURL(file);
      });
    }

    function estimateDataUrlBytes(dataUrl) {
      const b64 = (dataUrl || '').split(',')[1] || '';
      return Math.ceil(b64.length * 0.75);
    }

    function dataUrlToFile(dataUrl, filename = 'upload.jpg') {
      const [header, b64] = dataUrl.split(',');
      const mime = header.match(/:(.*?);/)?.[1] || 'image/jpeg';
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], filename, { type: mime });
    }

    /** 压缩到不超过 MAX_IMAGE_BYTES，返回实际上传用的 File */
    async function prepareImageForUpload(file, maxBytes = MAX_IMAGE_BYTES) {
      let maxW = 1280;
      let quality = 0.85;
      for (let attempt = 0; attempt < 14; attempt++) {
        const dataUrl = await compressImageFile(file, maxW, quality);
        const bytes = estimateDataUrlBytes(dataUrl);
        if (bytes <= maxBytes) {
          const name = (file.name || 'image').replace(/\.[^.]+$/i, '') + '.jpg';
          return { file: dataUrlToFile(dataUrl, name), previewUrl: dataUrl, bytes };
        }
        if (quality > 0.42) quality -= 0.07;
        else maxW = Math.max(320, Math.floor(maxW * 0.82));
      }
      throw new Error('TOO_LARGE');
    }

    function assertUploadFileSize(file) {
      if (file && file.size > MAX_IMAGE_BYTES) {
        alert(t('imageTooLarge'));
        return false;
      }
      return true;
    }

    async function handleImageFile(file, inputId) {
      if (!file || !file.type.startsWith('image/')) {
        alert(t('imageInvalid'));
        return;
      }
      const zone = getDropZone(inputId);
      const hint = zone?.querySelector('.drop-zone-hint');
      const prevHint = hint?.textContent;
      if (hint) hint.textContent = t('imageProcessing');
      try {
        const { file: readyFile, previewUrl } = await prepareImageForUpload(file);
        pendingFiles[inputId] = readyFile;
        setDropZoneImage(inputId, previewUrl);
      } catch (err) {
        if (err.message === 'TOO_LARGE') alert(t('imageTooLarge'));
        else {
          console.warn('image compress failed', err);
          alert(t('imageInvalid'));
        }
      } finally {
        if (hint && prevHint) hint.textContent = prevHint;
      }
    }

    async function handleImageFiles(files, inputId) {
      const list = Array.from(files || []).filter((file) => file?.type?.startsWith('image/'));
      if (!list.length) { alert(t('imageInvalid')); return; }
      const zone = getDropZone(inputId);
      const hint = zone?.querySelector('.drop-zone-hint');
      const prevHint = hint?.textContent;
      if (hint) hint.textContent = t('imageProcessing');
      try {
        const prepared = [];
        for (const file of list) {
          const result = await prepareImageForUpload(file);
          prepared.push(result);
        }
        pendingFiles[inputId] = prepared[0]?.file || null;
        setDropZoneBatch(inputId, prepared);
      } catch (err) {
        if (err.message === 'TOO_LARGE') alert(t('imageTooLarge'));
        else {
          console.warn('image compress failed', err);
          alert(t('imageInvalid'));
        }
      } finally {
        if (hint && prevHint && (pendingFileLists[inputId] || []).length <= 1) hint.textContent = prevHint;
      }
    }

    function initImageDropZones() {
      document.querySelectorAll('.drop-zone[data-drop-input]').forEach((zone) => {
        const inputId = zone.dataset.dropInput;
        const hidden = document.getElementById(inputId);
        const fileInput = zone.querySelector('.drop-file-input');
        const removeBtn = zone.querySelector('.drop-zone-remove');
        if (!hidden || !fileInput) return;

        const openPicker = () => fileInput.click();

        zone.addEventListener('click', (e) => {
          if (e.target.closest('.drop-zone-remove')) return;
          openPicker();
        });
        zone.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }
        });
        fileInput.addEventListener('change', () => {
          const files = Array.from(fileInput.files || []);
          resetUploadCache(inputId);
          if (!files.length) return;
          if (fileInput.multiple) handleImageFiles(files, inputId);
          else handleImageFile(files[0], inputId);
        });
        removeBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          clearDropZone(inputId);
        });

        ['dragenter', 'dragover'].forEach((ev) => {
          zone.addEventListener(ev, (e) => {
            e.preventDefault();
            e.stopPropagation();
            zone.classList.add('is-dragover');
            const hint = zone.querySelector('.drop-zone-hint');
            if (hint && ev === 'dragenter') hint.textContent = t('dropActive');
          });
        });
        zone.addEventListener('dragleave', (e) => {
          e.preventDefault();
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('is-dragover');
            const hint = zone.querySelector('.drop-zone-hint');
            if (hint) hint.textContent = t('dropHint');
          }
        });
        zone.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('is-dragover');
          const hint = zone.querySelector('.drop-zone-hint');
          if (hint) hint.textContent = t('dropHint');
          const files = e.dataTransfer?.files;
          if (files?.length) {
            if (fileInput.multiple) await handleImageFiles(files, inputId);
            else await handleImageFile(files[0], inputId);
          }
        });
      });
    }

    function parseTagsFromString(raw) {
      if (!raw || typeof raw !== 'string') return [];

    function buildDetailTags(data) {
      if (Array.isArray(data.tags) && data.tags.length) return data.tags;
      const fromPrompt = parseTagsFromString(data.prompt || data.style || '');
      if (fromPrompt.length) return fromPrompt.slice(0, 14);
      return data.category ? [data.category] : [];
    }

    function buildAiTags(style, category) {
      const tags = parseTagsFromString(style);
      if (category && category !== '全部' && !tags.includes(category)) tags.unshift(category);
      const clothingHints = ['针织', '牛仔', '西装', '连衣裙', '卫衣', '衬衫', '外套', 'skirt', 'jacket', 'dress', 'sweater', 'denim'];
      const detailHints = ['柔光', '自然光', '浅景深', '半身', '肖像', '街拍', 'portrait', 'soft light', 'bokeh'];
      const styleLower = (style || '').toLowerCase();
      [...clothingHints, ...detailHints].forEach((hint) => {
        if (styleLower.includes(hint.toLowerCase()) && !tags.some((t) => t.toLowerCase().includes(hint.toLowerCase()))) {
          tags.push(hint);
        }

    document.getElementById('form-kol').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const editId = document.getElementById('kol-id').value.trim();
      const existingKol = editId ? state.kols.find((k) => k.id === editId) : null;
      const kolFiles = (pendingFileLists['kol-image-data'] || []).map((item) => item.file).filter(Boolean);
      const file = kolFiles[0] || pendingFiles['kol-image-data'];
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        let imageUrl;
        let storagePath;
        if (file && !assertUploadFileSize(file)) return;
        if (file) {
          ({ imageUrl, storagePath } = await uploadOrUseLocalImage(file, POST_CATEGORIES.kol));
          if (existingKol?.storagePath) await deleteStorageFile(existingKol.storagePath);
        } else if (existingKol?.image) {
          imageUrl = existingKol.image;
          storagePath = existingKol.storagePath || '';
        } else if (f.image?.value?.trim()) {
          imageUrl = f.image.value.trim();
          storagePath = existingKol?.storagePath || '';
        } else {
          alert(t('imageRequired'));
          return;
        }
        const ethnicityVal = normalizeKolEthnicity(f.ethnicity.value);
        if (!ethnicityVal) { alert(appMeta.lang === 'en' ? 'Ethnicity is required.' : '请填写人种。'); return; }
        registerCustomKolEthnicity(ethnicityVal);
        const searchTags = parseTagsFromString(f.searchTags?.value);
        const metadata = {
          account: f.account.value.trim(),
          gender: f.gender.value,
          region: f.region.value.trim(),
          ethnicity: ethnicityVal,
          accountType: f.accountType.value.trim(),
          searchTags: searchTags.length ? searchTags : buildKolSearchTags({
            name: f.name.value.trim(),
            accountType: f.accountType.value.trim(),
            ethnicity: ethnicityVal,
            gender: f.gender.value,
            region: f.region.value.trim(),
            followers: f.followers.value.trim(),
          }),
        };
        const payload = {
          title: f.name.value.trim(),
          fans: f.followers.value.trim(),
          imageUrl,
          storagePath,
          metadata,
        };
        await savePost({
          id: editId || null,
          category: POST_CATEGORIES.kol,
          ...payload,
        });
        if (SUPABASE_READY) await fetchAllPosts();
        renderKols();
        closeModal('modal-kol');
        resetAllUploadCaches();
        document.getElementById('kol-id').value = '';
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

    function renderMasonry(containerId, items, filter, mode='web') {
      const c=document.getElementById(containerId);
      let list=filter==='全部'?items:items.filter((i)=>i.category===filter);
      if (mode === 'creative') {
        if (state.filterCreativeRegion) list = list.filter((item) => item.creativeRegion === state.filterCreativeRegion || item.category === state.filterCreativeRegion);
        if (state.filterCreativeDetail) list = list.filter((item) => item.detailCategory === state.filterCreativeDetail || item.category === state.filterCreativeDetail);
      }
      if (mode === 'web') {
        const filters = state.webFilters || {};
        list = list.filter((item) => Object.entries(filters).every(([key, values]) => {
          const selectedValues = normalizeTagList(values);
          if (!selectedValues.length) return true;
          const itemValues = normalizeTagList(item.webTags?.[key]);
          return selectedValues.some((value) => itemValues.includes(value));
        }));
      }
      if (mode === 'ai') {
        const filters = state.aiFilters || {};
        list = list.filter((item) => Object.entries(filters).every(([key, values]) => {
          const selectedValues = normalizeTagList(values);
          if (!selectedValues.length) return true;
          const itemValues = normalizeTagList(item.aiTags?.[key]);
          return selectedValues.some((value) => itemValues.includes(value));
        }));
      }
      const tab = getActiveTab();
      if (state.searchQuery.trim()) {
        if (mode === 'web' && tab === 'inspiration') {
          list = list.filter((i) => matchesSearch(buildInspirationSearchTags(i), i.style));
        } else if (mode === 'creative' && tab === 'creative') {
          list = list.filter((i) => matchesSearch(buildCreativeSearchTags(i), i.style));
        } else if (mode === 'ai' && tab === 'ai-models') {
          list = list.filter((i) => matchesSearch(buildAiSearchTags(i), i.prompt || i.style));
        }
      }
      if(!list.length){
        const searching = state.searchQuery.trim() && (
          (mode === 'web' && tab === 'inspiration') ||
          (mode === 'creative' && tab === 'creative') ||
          (mode === 'ai' && tab === 'ai-models')
        );
        const msg = searching ? t('noSearchResults') : t('noContent');
        c.innerHTML=`<p class="text-center text-ink/60 py-20">${esc(msg)}</p>`;return;
      }
      c.innerHTML=list.map((item)=>{
        const payload=JSON.stringify({
          image: item.image,
          mainImage: item.mainImage || item.image,
          beforeImage: item.beforeImage || '',
          afterImage: item.afterImage || '',
          displayMode: item.displayMode || '',
          category: item.category,
          prompt: item.prompt || item.style || '',
          tags: item.tags || buildDetailTags(item),
        }).replace(/'/g,'&#39;');
        return `<div class="masonry-item cursor-pointer" data-lightbox='${payload}' data-mode="${mode}" data-item-type="${mode}" data-item-id="${item.id}">
          <div class="media-card rounded-[20px] relative group card-img-wrap">
            ${favBtnHtml(mode, item.id)}
            ${buildCardImgHtml(item.image, item.style || '', 'w-full h-auto block')}
          </div>
        </div>`;
      }).join('');
      bindFavoriteButtons(c);
      bindCardImages(c);
      c.querySelectorAll('[data-lightbox]').forEach((card)=>card.addEventListener('click',(e)=>{
        if (e.target.closest('.fav-btn')) return;
        const data=JSON.parse(card.dataset.lightbox.replace(/&#39;/g,"'"));
        openLightbox(data, card.dataset.mode==='ai');
      }));
    }

    function openLightbox(data, isAi) {
      const imageWrap = document.getElementById('lightbox-image-wrap');
      const hasCompare = isAi && data.displayMode === 'compare' && (data.beforeImage || data.afterImage);
      imageWrap.innerHTML = hasCompare
        ? `<div class="before-after-lightbox-grid">
            ${data.beforeImage ? `<div class="before-after-lightbox-card"><span class="before-after-lightbox-label">Before</span><img src="${esc(data.beforeImage)}" alt="Before" onload="syncLightboxPanelHeight()" /></div>` : ''}
            ${data.afterImage ? `<div class="before-after-lightbox-card"><span class="before-after-lightbox-label">After</span><img src="${esc(data.afterImage)}" alt="After" onload="syncLightboxPanelHeight()" /></div>` : ''}
          </div>`
        : `<img id="lightbox-img" src="${esc(data.image)}" alt="" class="max-h-[85vh] w-full object-contain" onload="syncLightboxPanelHeight()" />`;
      const sidebar = document.getElementById('lightbox-sidebar');
      const sidebarMobile = document.getElementById('lightbox-sidebar-mobile');
      const inner = document.getElementById('lightbox-inner');

      if (isAi) {
        document.getElementById('lightbox').classList.add('soft-lightbox');
        const promptText = data.prompt || t('noPrompt');
        const tags = buildDetailTags(data);
        document.getElementById('lightbox-prompt').textContent = promptText;
        document.getElementById('lightbox-prompt-mobile').textContent = promptText;
        renderLightboxTags('lightbox-tags', tags);
        renderLightboxTags('lightbox-tags-mobile', tags);
        sidebar.classList.remove('hidden');
        sidebar.classList.add('md:flex');
        sidebarMobile.classList.remove('hidden');
        sidebarMobile.classList.add('flex');
        inner.classList.add('md:flex-row');
        inner.classList.remove('max-w-5xl');
        inner.classList.add('max-w-6xl');
      } else {
        document.getElementById('lightbox').classList.add('soft-lightbox');
        sidebar.classList.add('hidden');
        sidebar.classList.remove('md:flex');
        sidebarMobile.classList.add('hidden');
        sidebarMobile.classList.remove('flex');
        document.getElementById('lightbox-prompt').textContent = '';
        document.getElementById('lightbox-prompt-mobile').textContent = '';
        document.getElementById('lightbox-tags').innerHTML = '';
        document.getElementById('lightbox-tags-mobile').innerHTML = '';
        inner.classList.remove('md:flex-row');
        inner.classList.add('max-w-5xl');
        inner.classList.remove('max-w-6xl');
      }

      const lb = document.getElementById('lightbox');
      lb.classList.remove('hidden');
      lb.classList.add('flex');
      requestAnimationFrame(syncLightboxPanelHeight);
    }
    function closeLightbox(){const lb=document.getElementById('lightbox');lb.classList.add('hidden');lb.classList.remove('flex');lb.classList.remove('soft-lightbox');document.getElementById('lightbox-inner').style.removeProperty('--lightbox-image-height');}

      if (!item) return;
      const postCategory = uiTypeToPostCategory(type);
      if (postCategory === 'kol') state.kols.unshift(item);
      else if (postCategory === 'net_model') state.inspiration.unshift(item);

    async function handleDeleteByContext(type, id) {
      if (!requireAuth()) return;
      if (!confirm(t('confirmDelete'))) return;
      const item = findItemWithStorage(type, id);
      if (!item) return;
      const postCategory = uiTypeToPostCategory(type);
      const snapshot = { ...item };
      hideContextMenu();
      removePostFromState(postCategory, id);
      renderByCategory(postCategory);
      try {
        await deletePostById(id);

        console.error(err);
        restoreDeletedItem(type, id, snapshot);
        alert(t('deleteFailed') + '\n' + (err.message || ''));

    document.getElementById('form-gallery').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const type = document.getElementById('gallery-type').value;
      const editId = document.getElementById('gallery-id').value.trim();
      const postCategory = POST_CATEGORIES[type];
      const existingItem = editId ? findItemWithStorage(type, editId) : null;
      const file = pendingFiles['gallery-image-data'];
      const beforeFile = type === 'ai' ? pendingFiles['gallery-before-image-data'] : null;
      const afterFile = type === 'ai' ? pendingFiles['gallery-after-image-data'] : null;
      if (!file && !beforeFile && !afterFile && !existingItem?.image) { alert(t('imageRequired')); return; }
      if (file && !assertUploadFileSize(file)) return;
      if (beforeFile && !assertUploadFileSize(beforeFile)) return;
      if (afterFile && !assertUploadFileSize(afterFile)) return;
      const categoryVal = getGalleryCategoryValue(f, type);
      if (!categoryVal) { alert(appMeta.lang === 'en' ? 'Category is required.' : '请填写类型。'); return; }
      const webStructuredTags = type === 'inspiration' ? collectWebTags(f) : {};
      const aiStructuredTags = type === 'ai' ? collectAiTags(f) : {};
      const styleVal = type === 'inspiration'
        ? Object.values(webStructuredTags).flatMap((value) => Array.isArray(value) ? value : [value]).filter(Boolean).join(' / ') || '网图'
        : f.style.value.trim() || Object.values(aiStructuredTags).flat().join(' / ') || '未标注';
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        const uploadedImages = [];
        let beforeUpload = null;
        let afterUpload = null;
        if (file) {
          uploadedImages.push(await uploadOrUseLocalImage(file, postCategory));
          if (existingItem?.storagePath) await deleteStorageFile(existingItem.storagePath);
        } else if (type === 'ai' && (beforeFile || afterFile) && !existingItem?.image) {
          uploadedImages.push({ imageUrl: '', storagePath: '' });
        } else {
          uploadedImages.push({ imageUrl: existingItem.image, storagePath: existingItem.storagePath || '' });
        }
        if (type === 'ai' && beforeFile) {
          beforeUpload = await uploadOrUseLocalImage(beforeFile, postCategory);
          if (existingItem?.beforeStoragePath) await deleteStorageFile(existingItem.beforeStoragePath);
        }
        if (type === 'ai' && afterFile) {
          afterUpload = await uploadOrUseLocalImage(afterFile, postCategory);
          if (existingItem?.afterStoragePath) await deleteStorageFile(existingItem.afterStoragePath);
        }
        const metadata = {
          subcategory: categoryVal,
          style: styleVal,
        };
        if (type === 'ai') {
          const beforeImage = beforeUpload?.imageUrl || existingItem?.beforeImage || '';
          const afterImage = afterUpload?.imageUrl || existingItem?.afterImage || '';
          const beforeStoragePath = beforeUpload?.storagePath || existingItem?.beforeStoragePath || '';
          const afterStoragePath = afterUpload?.storagePath || existingItem?.afterStoragePath || '';
          metadata.prompt = styleVal;
          metadata.aiTags = aiStructuredTags;
          metadata.displayMode = f.compareMode?.checked ? 'compare' : 'single';
          metadata.beforeImage = beforeImage;
          metadata.afterImage = afterImage;
          metadata.beforeStoragePath = beforeStoragePath;
          metadata.afterStoragePath = afterStoragePath;
          const manualSearchTags = parseTagsFromString(f.searchTags?.value);
          metadata.tags = buildAiTags(styleVal, categoryVal);
          metadata.searchTags = manualSearchTags.length ? manualSearchTags : buildAiSearchTags({ category: categoryVal, style: styleVal, prompt: styleVal, aiTags: aiStructuredTags, tags: metadata.tags });
        } else if (type === 'inspiration') {
          metadata.webTags = webStructuredTags;
          const manualTags = parseTagsFromString(f.searchTags?.value);
          metadata.searchTags = manualTags.length ? manualTags : buildInspirationSearchTags({ category: categoryVal, style: styleVal, webTags: webStructuredTags });
        } else {
          const webTags = parseTagsFromString(f.searchTags?.value);
          metadata.searchTags = webTags.length ? webTags : buildCreativeSearchTags({ category: categoryVal, style: styleVal });
        }
        for (const uploaded of uploadedImages) {
          const displayImageUrl = type === 'ai'
            ? (metadata.displayMode === 'compare' ? (metadata.afterImage || metadata.beforeImage || uploaded.imageUrl) : (uploaded.imageUrl || metadata.afterImage || metadata.beforeImage))
            : uploaded.imageUrl;
          const displayStoragePath = type === 'ai'
            ? (metadata.displayMode === 'compare' ? (metadata.afterStoragePath || metadata.beforeStoragePath || uploaded.storagePath) : (uploaded.storagePath || metadata.afterStoragePath || metadata.beforeStoragePath))
            : uploaded.storagePath;
          const payload = {
            title: styleVal,
            fans: null,
            imageUrl: displayImageUrl,
            storagePath: displayStoragePath,
            metadata,
          };
          await savePost({
            id: editId || null,
            category: postCategory,
            ...payload,
          });
        }
        if (SUPABASE_READY) await fetchAllPosts();
        renderByCategory(postCategory);
        closeModal('modal-gallery');
        resetAllUploadCaches();
        document.getElementById('gallery-id').value = '';
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

      document.getElementById('auth-modal-title').textContent = isReg ? t('register') : t('login');

      document.getElementById('auth-confirm-wrap').classList.toggle('hidden', !isReg);

      if (confirmInput) confirmInput.required = isReg;
    }

    function mapAuthError(error, mode = 'login') {
      const msg = String(error?.message || error || '').toLowerCase();
      const code = String(error?.code || '').toLowerCase();
      if (msg.includes('email not confirmed') || code === 'email_not_confirmed') return t('emailNotConfirmed');
      if (mode === 'login' && (msg.includes('invalid login credentials') || code === 'invalid_credentials')) {
        return t('authLoginFailed');
      }
      if (msg.includes('user already registered') || msg.includes('already been registered')) return t('authExists');
      return error?.message || String(error);
    }

    document.getElementById('btn-switch-register').addEventListener('click', () => {
      setAuthMode(appMeta.authMode === 'login' ? 'register' : 'login');
    });
    document.getElementById('form-auth').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!SUPABASE) { alert(t('loadFailed')); return; }
      const f = e.target;
      const email = f.email.value.trim().toLowerCase();
      const password = f.password.value;
      const nickname = f.nickname.value.trim() || email.split('@')[0];
      if (!isValidEmail(email)) { alert(t('invalidEmail')); return; }
      if (password.length < 8) { alert(t('passwordTooShort')); return; }
      if (appMeta.authMode === 'register') {
        const confirm = f.confirmPassword?.value || '';
        if (password !== confirm) { alert(t('passwordMismatch')); return; }
      }
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        if (appMeta.authMode === 'register') {
          const { data, error } = await SUPABASE.auth.signUp({
            email,
            password,
            options: {
              data: { nickname },
              emailRedirectTo: window.location.origin + '/',
            },
          });
          if (error) throw error;
          if (data.user?.identities?.length === 0) {
            throw new Error(t('authExists'));
          }
          if (data.session) {
            closeModal('modal-auth');
            return;
          }
          alert(t('registerCheckEmail'));
          setAuthMode('login');
        } else {
          const { error } = await SUPABASE.auth.signInWithPassword({ email, password });
          if (error) throw new Error(mapAuthError(error, 'login'));
          closeModal('modal-auth');
        }
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('login'); }
      }
    });

    function fillSettingsForm() {
      const f = document.getElementById('form-settings');
      if (!f) return;
      const nickname = appMeta.user?.nickname || '';
      const avatarUrl = appMeta.user?.avatar || '';
      f.nickname.value = nickname;
      f.avatarUrl.value = avatarUrl;
      document.getElementById('settings-avatar-preview').src = avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || 'user')}`;
    }

    document.getElementById('menu-settings').addEventListener('click', () => {
      document.getElementById('user-menu').classList.add('hidden');
      if (!requireAuth()) return;
      fillSettingsForm();
      openModal('modal-settings');
    });

    function isValidHttpUrl(raw) {
      if (!raw) return true;
      try {
        const u = new URL(String(raw));
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    async function saveSettings(nickname, avatarUrl) {
      if (!SUPABASE || !authSession?.user?.id) throw new Error('NOT_AUTHENTICATED');
      const userId = authSession.user.id;
      const payload = {
        id: userId,
        nickname: nickname || null,
        avatar_url: avatarUrl || null,
        updated_at: new Date().toISOString(),
      };
      const { error } = await SUPABASE.from('profiles').upsert(payload);
      if (error) throw error;
      if (nickname) appMeta.user.nickname = nickname;
      if (avatarUrl) appMeta.user.avatar = avatarUrl;
      if (!avatarUrl) {
        appMeta.user.avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || userId)}`;
      }
      updateUserUI();
    }

    document.getElementById('form-settings').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const nickname = (f.nickname.value || '').trim();
      const avatarUrl = (f.avatarUrl.value || '').trim();
      if (!nickname) { alert(appMeta.lang === 'en' ? 'Nickname is required.' : '昵称不能为空。'); return; }
      if (!isValidHttpUrl(avatarUrl)) { alert(appMeta.lang === 'en' ? 'Avatar URL must be http(s).' : '头像链接必须是 http/https URL。'); return; }
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        await saveSettings(nickname, avatarUrl);
        closeModal('modal-settings');
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

    document.getElementById('form-settings').avatarUrl?.addEventListener?.('input', (e) => {
      const v = String(e.target.value || '').trim();
      const preview = document.getElementById('settings-avatar-preview');
      if (!preview) return;
      preview.src = v || (appMeta.user?.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || 'user')}`);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#user-area')) document.getElementById('user-menu').classList.add('hidden');
      if (!e.target.closest('#btn-lang') && !e.target.closest('#lang-popover')) document.getElementById('lang-popover').classList.add('hidden');
    });

    ['modal-kol', 'modal-gallery', 'modal-auth', 'modal-settings'].forEach((id) => {
      const m = document.getElementById(id);
      if (m) m.addEventListener('click', (e) => { if (e.target === m && !window.getSelection().toString().trim()) closeModal(id); });
    });
    document.querySelectorAll('.modal-close').forEach((b) => {
      if (!b.dataset.modal) return;
      b.addEventListener('click', () => closeModal(b.dataset.modal));
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeModal('modal-kol');
        closeModal('modal-gallery');
        closeModal('modal-auth');
        closeModal('modal-settings');
        closeFavoritesDrawer();
        document.getElementById('user-menu').classList.add('hidden');
        document.getElementById('lang-popover').classList.add('hidden');
      }
    });

    async function bootstrap() {
      initImageDropZones();
      loadMeta();
      switchSubheader('kol');
      document.getElementById('global-search').value = state.searchQuery || '';
      await initAuth();
      toggleUploadButtons(hasSupabaseSession());
      try {
        await fetchAllPosts();
        applyI18n();
      } catch (err) {
        console.error(err);
        alert(t('loadFailed') + '\n' + (err.message || ''));
        applyI18n();
      }
    }

    bootstrap();
  </script>
</body>
</html>
