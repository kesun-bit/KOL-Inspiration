<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreatorLook</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f8f8f7',
            paper2: '#f3f3f2',
            surface: '#ffffff',
            ink: '#3f3f3f',
            deep: '#2f2f2f',
            wash: '#ececeb',
            line: 'rgba(0,0,0,0.08)',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            card: '0 6px 24px rgba(0,0,0,0.06)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      background: linear-gradient(180deg, #fafaf9 0%, #f4f4f3 100%);
    }
    .page-shell { width: 100%; padding-left: 12px; padding-right: 12px; }
    @media (min-width: 640px) { .page-shell { padding-left: 16px; padding-right: 16px; } }
    @media (min-width: 1024px) { .page-shell { padding-left: 20px; padding-right: 20px; } }

    .masonry { column-count: 2; column-gap: 12px; }
    @media (min-width: 640px) { .masonry { column-count: 3; column-gap: 14px; } }
    @media (min-width: 768px) { .masonry { column-count: 4; } }
    @media (min-width: 1024px) { .masonry { column-count: 5; column-gap: 16px; } }
    @media (min-width: 1280px) { .masonry { column-count: 6; } }
    @media (min-width: 1536px) { .masonry { column-count: 7; } }
    .masonry-item { break-inside: avoid; margin-bottom: 12px; }

    .tab-segment .main-tab {
      padding: 8px 18px;
      border-radius: 999px;
      color: #7a7a7a;
      font-size: 13px;
      font-weight: 500;
      transition: all .2s ease;
    }
    .tab-segment .main-tab.tab-active {
      background: #fff;
      color: #3f3f3f;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    .filter-scroll { -ms-overflow-style: none; scrollbar-width: none; gap: 22px; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-link {
      position: relative;
      color: #6f6f6f;
      padding: 8px 4px;
      font-size: 13px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: color .2s ease;
    }
    .filter-link:hover { color: #3f3f3f; }
    .filter-link-active {
      color: #2f2f2f;
      font-weight: 600;
    }
    .filter-link-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 2px;
      border-radius: 2px;
      background: #2f2f2f;
    }

    .btn-godly {
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      font-size: 13px;
      font-weight: 600;
      transition: all .2s ease;
    }
    .btn-godly:hover { background: #ececeb; }
    .btn-godly-primary {
      background: #3a3a3a;
      border-color: #3a3a3a;
      color: #fff;
    }
    .btn-godly-primary:hover { background: #2f2f2f; border-color: #2f2f2f; }

    .morandi-tag {
      display: inline-flex;
      align-items: center;
      background: #e5e5e2;
      color: #474747;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .media-card {
      border-radius: 20px;
      overflow: hidden;
      background: #f0f0ef;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      transition: transform .35s cubic-bezier(.16,1,.3,1);
    }
    .media-card:hover { transform: translateY(-2px); }
    .media-card img { transition: transform .6s cubic-bezier(.16,1,.3,1); }
    .media-card:hover img { transform: scale(1.03); }
    .context-menu {
      position: fixed;
      z-index: 70;
      min-width: 140px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.12);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      padding: 6px;
    }
    .context-menu-item {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #3f3f3f;
      transition: background .15s ease;
    }
    .context-menu-item:hover { background: #f2f2f2; }

    .kol-card {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 26px rgba(0,0,0,.08);
      background: #fff;
    }
    .kol-image { aspect-ratio: 4/5; background: #efefee; overflow: hidden; position: relative; }
    .kol-image img { width: 100%; height: 100%; object-fit: cover; }
    .kol-overlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 16px 14px 14px;
      background: linear-gradient(to top, rgba(0,0,0,.52) 0%, rgba(0,0,0,.28) 55%, transparent 100%);
      color: #fff;
    }
    .kol-name { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .kol-desc { margin-top: 6px; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .kol-followers {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: rgba(255,255,255,.92);
    }
    .kol-profile-link {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, opacity .2s ease;
    }
    .kol-profile-link:hover { opacity: .86; transform: translateX(1px); }

    .header-search {
      position: relative;
      flex-shrink: 1;
      min-width: 0;
      max-width: 220px;
    }
    .header-search input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.1);
      background: #ececeb;
      font-size: 13px;
      color: #3f3f3f;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .header-search input:focus {
      border-color: rgba(0,0,0,.18);
      box-shadow: 0 0 0 3px rgba(0,0,0,.04);
    }
    .header-search .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a8a8a;
      pointer-events: none;
    }

    .lightbox-enter { animation: fade .3s ease; }
    @keyframes fade { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1);} }

    .subheader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
    }
    .btn-upload {
      flex-shrink: 0;
      height: 36px;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #2f2f2f;
      transition: opacity .2s ease;
    }
    .btn-upload:hover { opacity: .7; }

    .lightbox-tag {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.88);
      line-height: 1.2;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #3f3f3f;
      transition: background .15s ease, opacity .15s ease;
    }
    .icon-btn:hover { background: #ececeb; }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
    }
    .fav-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 auto;
    }
    .media-card:hover .fav-btn,
    .kol-image:hover .fav-btn,
    .fav-btn.is-active { opacity: 1; }
    .fav-btn:hover { transform: scale(1.06); }

    .user-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 220px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.1);
      background: #fff;
      box-shadow: 0 12px 36px rgba(0,0,0,.12);
      padding: 8px;
      z-index: 50;
    }
    .user-menu-item {
      width: 100%;
      text-align: left;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      color: #3f3f3f;
      transition: background .15s ease;
    }
    .user-menu-item:hover { background: #f2f2f2; }
    .user-menu-divider { height: 1px; background: rgba(0,0,0,.08); margin: 6px 4px; }

    .lang-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.1);
      background: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,.1);
      padding: 6px;
      z-index: 50;
      min-width: 120px;
    }
    .lang-option {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .lang-option:hover { background: #f2f2f2; }
    .lang-option-active { background: #ececeb; color: #2f2f2f; }

    .favorites-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw);
      background: #fff;
      z-index: 55;
      box-shadow: -8px 0 32px rgba(0,0,0,.12);
      transform: translateX(100%);
      transition: transform .3s ease;
    }
    .favorites-drawer.open { transform: translateX(0); }
    .fav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fav-thumb { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #efefee; }
    .fav-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .header-top-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px 12px;
    }
    .header-top-center { justify-self: center; }
    .header-top-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .drop-zone {
      position: relative;
      min-height: 148px;
      border-radius: 16px;
      border: 1.5px dashed rgba(0,0,0,.16);
      background: #f3f3f2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color .2s ease, background .2s ease;
    }
    .drop-zone:hover, .drop-zone:focus-visible { border-color: rgba(0,0,0,.28); background: #ececeb; }
    .drop-zone.is-dragover { border-color: #3f3f3f; background: #e8e8e6; }
    .drop-zone.has-image { border-style: solid; border-color: rgba(0,0,0,.1); padding: 0; min-height: 0; }
    .drop-zone-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px;
      text-align: center;
      pointer-events: none;
    }
    .drop-zone.has-image .drop-zone-empty { display: none; }
    .drop-zone-hint { font-size: 12px; color: #7a7a7a; line-height: 1.4; max-width: 220px; }
    .drop-zone-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }
    .drop-zone.has-image .drop-zone-preview { display: block; }
    .drop-zone:not(.has-image) .drop-zone-preview { display: none; }
    .drop-zone-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .drop-zone:not(.has-image) .drop-zone-remove { display: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .card-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      background: #efefee;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .card-img.is-loaded { opacity: 1; }
    .card-img-wrap { background: #efefee; overflow: hidden; }

    .tabs-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
      max-width: 100%;
      overflow-x: auto;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    @media (max-width: 639px) {
      .header-top-row {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        height: auto;
        min-height: 72px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: 10px;
        gap: 10px 10px;
      }
      .header-top-row > div:first-child { grid-column: 1; }
      .header-top-right { grid-column: 2; grid-row: 1; }
      .header-top-center {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: stretch;
        width: 100%;
      }
      .header-top-row .tab-segment { width: 100%; justify-content: flex-start; }
      .main-tab { padding: 7px 12px; font-size: 12px; }
      .header-logo { height: 82px !important; width: auto !important; object-fit: contain; }
      .subheader-row { flex-wrap: wrap; gap: 10px; min-height: 44px; }
      .btn-upload { height: 32px; font-size: 12px; }
      .filter-link { font-size: 12px; padding: 6px 2px; }
      .masonry { column-count: 2; column-gap: 10px; }
      .masonry-item { margin-bottom: 10px; }
      .kol-name { font-size: 15px; }
      .kol-overlay { padding: 12px 10px 10px; }
      .page-shell { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      body { padding-bottom: env(safe-area-inset-bottom); }
      .favorites-drawer { width: 100vw; padding-bottom: env(safe-area-inset-bottom); }
      .context-menu { min-width: 128px; }
      .modal-panel { max-height: min(92vh, calc(100dvh - 24px)); }
    }

    @media (min-width: 640px) and (max-width: 1023px) {
      .header-top-row { height: 72px; gap: 8px 12px; }
      .main-tab { padding: 7px 14px; font-size: 12px; }
      .masonry { column-count: 3; }
    }

    @media (min-width: 1024px) {
      .masonry { column-count: 5; }
    }

    @media (pointer: coarse) {
      .fav-btn { opacity: 1; }
      .media-card:hover { transform: none; }
      .kol-card .fav-btn { opacity: 1; }
    }
  </style>
</head>
<body class="text-ink font-sans min-h-screen antialiased">

  <header class="sticky top-0 z-40 bg-paper/90 backdrop-blur-xl border-b border-line">
    <div class="page-shell header-top-row h-[92px]">
      <div class="flex items-center justify-start min-w-0">
        <img src="assets/logo.png" alt="CreatorLook 3D Logo" class="header-logo h-[84px] w-auto object-contain shrink-0 drop-shadow-[0_10px_26px_rgba(0,0,0,0.16)]" />
      </div>
      <nav id="main-tabs" class="tab-segment tabs-scroll header-top-center flex items-center p-1 rounded-full bg-wash" role="tablist">
        <button data-tab="kol" class="main-tab tab-active" role="tab" data-i18n="tabKol">KOL</button>
        <button data-tab="ai-models" class="main-tab" role="tab" data-i18n="tabAi">AI模特</button>
        <button data-tab="creative" class="main-tab" role="tab" data-i18n="tabCreative">灵感</button>
      </nav>
      <div class="header-top-right relative">
        <div class="header-search hidden sm:block w-[120px] md:w-[160px] lg:w-[200px]">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input id="global-search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="搜索标签、风格..." />
        </div>
        <button id="btn-search-mobile" type="button" class="icon-btn sm:hidden" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        </button>
        <div class="relative">
          <button id="btn-lang" type="button" class="icon-btn" aria-label="Language" title="CH / EN">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 8h14M5 12h10M5 16h6"/><circle cx="17" cy="12" r="4"/><path d="M15 10h4M15 14h4"/></svg>
          </button>
          <div id="lang-popover" class="lang-popover hidden">
            <button type="button" class="lang-option lang-option-active" data-lang="zh">CH</button>
            <button type="button" class="lang-option" data-lang="en">EN</button>
          </div>
        </div>
        <button id="btn-favorites-open" type="button" class="icon-btn" aria-label="Favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5l-1.1-1C5.5 14.8 2 11.6 2 7.9 2 5.2 4.2 3 7 3c1.7 0 3.3.8 4.3 2.1C12.3 3.8 14 3 15.7 3 18.5 3 20.7 5.2 20.7 7.9c0 3.7-3.5 6.9-8.9 11.6L12 20.5z"/></svg>
        </button>
        <div id="user-area" class="relative ml-0.5">
          <button id="btn-login" type="button" class="hidden text-[13px] font-semibold text-deep hover:opacity-70 px-2 h-9" data-i18n="loginRegister">登录/注册</button>
          <button id="btn-avatar" type="button" class="hidden w-9 h-9 rounded-full overflow-hidden border border-line bg-wash">
            <img id="user-avatar-img" src="" alt="" class="w-full h-full object-cover" />
          </button>
          <div id="user-menu" class="user-menu hidden">
            <div class="px-3 py-2 border-b border-line/80 mb-1">
              <p id="menu-nickname" class="text-sm font-semibold text-deep"></p>
              <p id="menu-account-type" class="text-xs text-ink/60 mt-0.5"></p>
              <p id="menu-email" class="text-xs text-ink/50 mt-0.5 truncate"></p>
            </div>
            <button type="button" class="user-menu-item" id="menu-my-favorites" data-i18n="myFavorites">我的收藏</button>
            <button type="button" class="user-menu-item" id="menu-settings" data-i18n="settings">设置</button>
            <div class="user-menu-divider"></div>
            <button type="button" class="user-menu-item text-red-600/90" id="menu-logout" data-i18n="logout">退出登录</button>
          </div>
        </div>
      </div>
    </div>
    <div class="page-shell">
      <div id="subheader-kol" class="subheader-row">
        <div id="filter-kol-ethnicity" class="filter-scroll flex items-center overflow-x-auto min-w-0"></div>
        <button id="btn-add-kol" type="button" class="btn-upload" data-i18n="upload">Upload</button>
      </div>
      <div id="subheader-inspiration" class="subheader-row hidden">
        <div id="filter-inspiration" class="filter-scroll flex items-center overflow-x-auto min-w-0"></div>
        <button id="btn-add-inspiration" type="button" class="btn-upload" data-i18n="upload">Upload</button>
      </div>
      <div id="subheader-creative" class="subheader-row hidden">
        <div id="filter-creative" class="filter-scroll flex items-center overflow-x-auto min-w-0"></div>
        <button id="btn-add-creative" type="button" class="btn-upload" data-i18n="upload">Upload</button>
      </div>
      <div id="subheader-ai-models" class="subheader-row hidden">
        <div id="filter-ai" class="filter-scroll flex items-center overflow-x-auto min-w-0"></div>
        <button id="btn-add-ai" type="button" class="btn-upload" data-i18n="upload">Upload</button>
      </div>
    </div>
  </header>

  <main class="page-shell pt-5 pb-16 w-full">
    <section id="panel-kol" class="tab-panel">
      <div id="kol-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 2xl:grid-cols-6 gap-3 sm:gap-4"></div>
    </section>

    <section id="panel-inspiration" class="tab-panel hidden">
      <div id="inspiration-masonry" class="masonry"></div>
    </section>

    <section id="panel-creative" class="tab-panel hidden">
      <div id="creative-masonry" class="masonry"></div>
    </section>

    <section id="panel-ai-models" class="tab-panel hidden">
      <div id="ai-masonry" class="masonry"></div>

      const { data: { user } } = await SUPABASE.auth.getUser();
      if (!user?.id) throw new Error(t('authRequired'));
      const ext = (file.name?.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/gi, '') || 'jpg';
      const filePath = `${category}/${user.id}/${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await SUPABASE.storage.from(SUPABASE_BUCKET).upload(filePath, file, {
        cacheControl: '3600',
        upsert: false,
        contentType: file.type || 'image/jpeg',
      });
      if (uploadError) throw uploadError;
      const { data } = SUPABASE.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
      return { imageUrl: data.publicUrl, storagePath: filePath, provider: 'supabase' };
    }

    const MAX_IMAGE_BYTES = 200 * 1024;
    const DEFAULT_FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&q=80';

    function getDropZone(inputId) {

    function setDropZoneImage(inputId, src) {
      const input = document.getElementById(inputId);

    function clearDropZone(inputId) {
      const input = document.getElementById(inputId);
      const zone = getDropZone(inputId);
      if (!input || !zone) return;
      input.value = '';
      pendingFiles[inputId] = null;
      const preview = zone.querySelector('.drop-zone-preview');

    function compressImageFile(file, maxW = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('decode'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('read'));
        reader.readAsDataURL(file);
      });
    }

    function estimateDataUrlBytes(dataUrl) {
      const b64 = (dataUrl || '').split(',')[1] || '';
      return Math.ceil(b64.length * 0.75);
    }

    function dataUrlToFile(dataUrl, filename = 'upload.jpg') {
      const [header, b64] = dataUrl.split(',');
      const mime = header.match(/:(.*?);/)?.[1] || 'image/jpeg';
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], filename, { type: mime });
    }

    /** 压缩到不超过 MAX_IMAGE_BYTES，返回实际上传用的 File */
    async function prepareImageForUpload(file, maxBytes = MAX_IMAGE_BYTES) {
      let maxW = 1280;
      let quality = 0.85;
      for (let attempt = 0; attempt < 14; attempt++) {
        const dataUrl = await compressImageFile(file, maxW, quality);
        const bytes = estimateDataUrlBytes(dataUrl);
        if (bytes <= maxBytes) {
          const name = (file.name || 'image').replace(/\.[^.]+$/i, '') + '.jpg';
          return { file: dataUrlToFile(dataUrl, name), previewUrl: dataUrl, bytes };
        }
        if (quality > 0.42) quality -= 0.07;
        else maxW = Math.max(320, Math.floor(maxW * 0.82));
      }
      throw new Error('TOO_LARGE');
    }

    function assertUploadFileSize(file) {
      if (file && file.size > MAX_IMAGE_BYTES) {
        alert(t('imageTooLarge'));
        return false;
      }
      return true;
    }

    async function handleImageFile(file, inputId) {
      if (!file || !file.type.startsWith('image/')) {
        alert(t('imageInvalid'));
        return;
      }
      const zone = getDropZone(inputId);
      const hint = zone?.querySelector('.drop-zone-hint');
      const prevHint = hint?.textContent;
      if (hint) hint.textContent = t('imageProcessing');
      try {
        const { file: readyFile, previewUrl } = await prepareImageForUpload(file);
        pendingFiles[inputId] = readyFile;
        setDropZoneImage(inputId, previewUrl);
      } catch (err) {
        if (err.message === 'TOO_LARGE') alert(t('imageTooLarge'));
        else {
          console.warn('image compress failed', err);
          alert(t('imageInvalid'));
        }
      } finally {
        if (hint && prevHint) hint.textContent = prevHint;
      }
    }

    function initImageDropZones() {
      document.querySelectorAll('.drop-zone[data-drop-input]').forEach((zone) => {
        const inputId = zone.dataset.dropInput;
        const hidden = document.getElementById(inputId);
        const fileInput = zone.querySelector('.drop-file-input');
        const removeBtn = zone.querySelector('.drop-zone-remove');
        if (!hidden || !fileInput) return;

        const openPicker = () => fileInput.click();

        zone.addEventListener('click', (e) => {
          if (e.target.closest('.drop-zone-remove')) return;
          openPicker();
        });
        zone.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }
        });
        fileInput.addEventListener('change', () => {
          const file = fileInput.files?.[0];
          if (file) handleImageFile(file, inputId);
        });
        removeBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          clearDropZone(inputId);
        });

        ['dragenter', 'dragover'].forEach((ev) => {
          zone.addEventListener(ev, (e) => {
            e.preventDefault();
            e.stopPropagation();
            zone.classList.add('is-dragover');
            const hint = zone.querySelector('.drop-zone-hint');
            if (hint && ev === 'dragenter') hint.textContent = t('dropActive');
          });
        });
        zone.addEventListener('dragleave', (e) => {
          e.preventDefault();
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove('is-dragover');
            const hint = zone.querySelector('.drop-zone-hint');

    function parseTagsFromString(raw) {
      if (!raw || typeof raw !== 'string') return [];
      return raw.split(/[,，;；\n|／/]/).map((s) => s.trim()).filter(Boolean);
    }

    function buildDetailTags(data) {
      if (Array.isArray(data.tags) && data.tags.length) return data.tags;
      const fromPrompt = parseTagsFromString(data.prompt || data.style || '');
      if (fromPrompt.length) return fromPrompt.slice(0, 14);
      return data.category ? [data.category] : [];
    }

    function buildAiTags(style, category) {
      const tags = parseTagsFromString(style);
      if (category && category !== '全部' && !tags.includes(category)) tags.unshift(category);
      const clothingHints = ['针织', '牛仔', '西装', '连衣裙', '卫衣', '衬衫', '外套', 'skirt', 'jacket', 'dress', 'sweater', 'denim'];
      const detailHints = ['柔光', '自然光', '浅景深', '半身', '肖像', '街拍', 'portrait', 'soft light', 'bokeh'];
      const styleLower = (style || '').toLowerCase();
      [...clothingHints, ...detailHints].forEach((hint) => {
        if (styleLower.includes(hint.toLowerCase()) && !tags.some((t) => t.toLowerCase().includes(hint.toLowerCase()))) {
          tags.push(hint);
        }
      });
      tags.push('高细节', '电影感光线');
      return [...new Set(tags)].slice(0, 12);
    }

    document.getElementById('form-kol').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const editId = document.getElementById('kol-id').value.trim();
      const existingKol = editId ? state.kols.find((k) => k.id === editId) : null;
      const file = pendingFiles['kol-image-data'];
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        let imageUrl;
        let storagePath;
        if (file && !assertUploadFileSize(file)) return;
        if (file) {
          ({ imageUrl, storagePath } = await uploadImageToStorage(file, POST_CATEGORIES.kol));
          if (existingKol?.storagePath) await deleteStorageFile(existingKol.storagePath);
        } else if (existingKol?.image) {
          imageUrl = existingKol.image;
          storagePath = existingKol.storagePath || '';
        } else if (f.image?.value?.trim()) {
          imageUrl = f.image.value.trim();
          storagePath = existingKol?.storagePath || '';
        } else {
          alert(t('imageRequired'));
          return;
        }
        const ethnicityVal = normalizeKolEthnicity(f.ethnicity.value);
        if (!ethnicityVal) { alert(appMeta.lang === 'en' ? 'Ethnicity is required.' : '请填写人种。'); return; }
        registerCustomKolEthnicity(ethnicityVal);
        const searchTags = parseTagsFromString(f.searchTags?.value);
        const metadata = {
          account: f.account.value.trim(),
          gender: f.gender.value,
          region: f.region.value.trim(),
          ethnicity: ethnicityVal,
          accountType: f.accountType.value.trim(),
          searchTags: searchTags.length ? searchTags : buildKolSearchTags({
            name: f.name.value.trim(),
            accountType: f.accountType.value.trim(),
            ethnicity: ethnicityVal,
            gender: f.gender.value,
            region: f.region.value.trim(),
            followers: f.followers.value.trim(),
          }),
        };
        const payload = {
          title: f.name.value.trim(),
          fans: f.followers.value.trim(),
          imageUrl,
          storagePath,
          metadata,
        };
        if (editId) {
          await updatePost({ id: editId, ...payload });
        } else {
          await insertPost({
            category: POST_CATEGORIES.kol,
            ...payload,
          });
        }
        await fetchAllPosts();
        renderKols();
        closeModal('modal-kol');
        clearDropZone('kol-image-data');
        document.getElementById('kol-id').value = '';
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

      const c=document.getElementById(containerId);
      let list=filter==='全部'?items:items.filter((i)=>i.category===filter);
      const tab = getActiveTab();
      const loggedIn = !!appMeta.user;
      if (state.searchQuery.trim()) {
        if (mode === 'web' && tab === 'inspiration') {
          list = list.filter((i) => matchesSearch(buildInspirationSearchTags(i), i.style));
        } else if (mode === 'creative' && tab === 'creative') {
          list = list.filter((i) => matchesSearch(buildCreativeSearchTags(i), i.style));
        } else if (mode === 'ai' && tab === 'ai-models') {
          list = list.filter((i) => matchesSearch(buildAiSearchTags(i), i.prompt || i.style));
        }
      }
      if(!loggedIn) list = list.slice(0, 12);
      if(!list.length){
        const searching = state.searchQuery.trim() && (
          (mode === 'web' && tab === 'inspiration') ||
          (mode === 'creative' && tab === 'creative') ||
          (mode === 'ai' && tab === 'ai-models')
        );

          image: item.image,

          prompt: item.prompt || item.style || '',
          tags: item.tags || buildDetailTags(item),
        }).replace(/'/g,'&#39;');

      const canEdit = hasSupabaseSession() && ['kol', 'ai', 'creative'].includes(contextTarget.type);
      contextEditBtn.classList.toggle('hidden', !canEdit);
      contextMenu.classList.remove('hidden');
      const menuWidth = 152;
      const menuHeight = 88;
      const left = Math.min(x, window.innerWidth - menuWidth - 8);
      const top = Math.min(y, window.innerHeight - menuHeight - 8);
      contextMenu.style.left = `${left}px`;
      contextMenu.style.top = `${top}px`;
    }

    document.addEventListener('contextmenu', (e) => {
      const target = e.target.closest('[data-item-type][data-item-id]');
      if (!target) {
        hideContextMenu();
        return;
      }
      e.preventDefault();
      showContextMenuAt(e.clientX, e.clientY, target);
    });

    let touchPressTimer = null;
    let touchPressTarget = null;
    document.addEventListener('touchstart', (e) => {
      const target = e.target.closest('[data-item-type][data-item-id]');
      if (!target) return;
      touchPressTarget = target;
      clearTimeout(touchPressTimer);
      touchPressTimer = setTimeout(() => {
        if (touchPressTarget !== target) return;
        const rect = target.getBoundingClientRect();
        showContextMenuAt(rect.left + rect.width / 2, rect.top + 24, target);
      }, 520);
    }, { passive: true });
    document.addEventListener('touchend', () => { clearTimeout(touchPressTimer); touchPressTarget = null; });
    document.addEventListener('touchmove', () => { clearTimeout(touchPressTimer); });

    contextEditBtn.addEventListener('click', () => {
      if (!contextTarget) return;
      const { type, id } = contextTarget;
      hideContextMenu();
      if (!requireAuth()) return;
      if (type === 'kol') editKol(id);
      else if (type === 'ai' || type === 'creative') editGalleryItem(type, id);
    });

    contextDeleteBtn.addEventListener('click', () => {
      if (!contextTarget) return;
      const { type, id } = contextTarget;
      hideContextMenu();
      handleDeleteByContext(type, id);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#context-menu')) hideContextMenu();
    });

    function populateGalleryCategories(type) {
      const categorySelect = document.getElementById('gallery-category-select');
      const categoryInput = document.getElementById('gallery-category-input');
      const isAi = type === 'ai';
      categorySelect.classList.toggle('hidden', isAi);
      categoryInput.classList.toggle('hidden', !isAi);
      if (isAi) {
        populateAiCategoryDatalist();
        return;
      }
      const categories = type === 'creative' ? CREATIVE_CATEGORIES : CATEGORIES;
      const labelFn = type === 'creative' ? tCreativeCat : tCat;
      categorySelect.innerHTML = '';
      categories.filter((c) => c !== '全部').forEach((c) => {
        const o = document.createElement('option');
        o.value = c;
        o.textContent = labelFn(c);
        categorySelect.appendChild(o);
      });
    }

    function getGalleryCategoryValue(f, type) {
      if (type === 'ai') return (f.categoryInput?.value || '').trim();
      return f.category.value;
    }

    function openGalleryModal(type) {
      document.getElementById('gallery-type').value = type;
      document.getElementById('gallery-id').value = '';
      const titles = { inspiration: t('addWeb'), creative: t('addCreative'), ai: t('addAi') };
      document.getElementById('modal-gallery-title').textContent = titles[type] || t('addWeb');
      document.getElementById('gallery-tags-field').classList.toggle('hidden', type !== 'ai');
      document.getElementById('gallery-web-tags-field').classList.toggle('hidden', type === 'ai');
      populateGalleryCategories(type);
      document.getElementById('form-gallery').reset();
      document.getElementById('gallery-type').value = type;
      clearDropZone('gallery-image-data');
      openModal('modal-gallery');
    }

    function editGalleryItem(type, id) {
      const item = findItemWithStorage(type, id);
      if (!item) return;
      document.getElementById('gallery-type').value = type;
      document.getElementById('gallery-id').value = id;
      const titles = { creative: t('editCreative'), ai: t('editAi') };
      document.getElementById('modal-gallery-title').textContent = titles[type] || t('edit');
      document.getElementById('gallery-tags-field').classList.toggle('hidden', type !== 'ai');
      document.getElementById('gallery-web-tags-field').classList.toggle('hidden', type === 'ai');
      populateGalleryCategories(type);
      const f = document.getElementById('form-gallery');
      pendingFiles['gallery-image-data'] = null;
      f.categoryInput.value = item.category;
      f.category.value = item.category;
      f.style.value = item.style || '';
      if (type === 'ai') {
        f.tags.value = (item.tags || []).join(', ');
      } else {
        f.searchTags.value = (item.searchTags || []).join(', ');
      }
      setDropZoneImage('gallery-image-data', item.image || '');
      openModal('modal-gallery');
    }
    document.getElementById('btn-add-inspiration').addEventListener('click',()=>{ if (requireAuth()) openGalleryModal('inspiration'); });
    document.getElementById('btn-add-creative').addEventListener('click',()=>{ if (requireAuth()) openGalleryModal('creative'); });
    document.getElementById('btn-add-ai').addEventListener('click',()=>{ if (requireAuth()) openGalleryModal('ai'); });

    document.getElementById('form-gallery').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const type = document.getElementById('gallery-type').value;
      const editId = document.getElementById('gallery-id').value.trim();
      const postCategory = POST_CATEGORIES[type];
      const existingItem = editId ? findItemWithStorage(type, editId) : null;
      const file = pendingFiles['gallery-image-data'];
      if (!file && !existingItem?.image) { alert(t('imageRequired')); return; }
      if (file && !assertUploadFileSize(file)) return;
      const categoryVal = getGalleryCategoryValue(f, type);
      if (!categoryVal) { alert(appMeta.lang === 'en' ? 'Category is required.' : '请填写类型。'); return; }
      const styleVal = f.style.value.trim() || '未标注';
      if (type === 'ai') registerCustomAiCategory(categoryVal);
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        let imageUrl;
        let storagePath;
        if (file) {
          ({ imageUrl, storagePath } = await uploadImageToStorage(file, postCategory));
          if (existingItem?.storagePath) await deleteStorageFile(existingItem.storagePath);
        } else {
          imageUrl = existingItem.image;
          storagePath = existingItem.storagePath || '';
        }
        const metadata = {
          subcategory: categoryVal,
          style: styleVal,
        };
        if (type === 'ai') {
          metadata.prompt = styleVal;
          const manualTags = parseTagsFromString(f.tags?.value);
          metadata.tags = manualTags.length ? manualTags : buildAiTags(styleVal, categoryVal);
        } else {
          const webTags = parseTagsFromString(f.searchTags?.value);
          metadata.searchTags = webTags.length ? webTags : (type === 'creative'
            ? buildCreativeSearchTags({ category: categoryVal, style: styleVal })
            : buildInspirationSearchTags({ category: categoryVal, style: styleVal }));
        }
        const payload = {
          title: styleVal,
          fans: null,
          imageUrl,
          storagePath,
          metadata,
        };
        if (editId) {
          await updatePost({ id: editId, ...payload });
        } else {
          await insertPost({ category: postCategory, ...payload });
        }
        await fetchAllPosts();
        renderByCategory(postCategory);
        closeModal('modal-gallery');
        clearDropZone('gallery-image-data');
        document.getElementById('gallery-id').value = '';
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

    const globalSearch = document.getElementById('global-search');
    globalSearch.addEventListener('input', () => {
      state.searchQuery = globalSearch.value;
      saveMeta();
      runActiveSearchRender();
    });
    globalSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { globalSearch.value = ''; state.searchQuery = ''; saveMeta(); runActiveSearchRender(); }
    });
    document.getElementById('btn-search-mobile').addEventListener('click', () => {
      const q = prompt(t('searchPlaceholder'), state.searchQuery);
      if (q === null) return;
      state.searchQuery = q;
      globalSearch.value = q;
      saveMeta();
      runActiveSearchRender();
    });

    document.getElementById('btn-lang').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('lang-popover').classList.toggle('hidden');
      document.getElementById('user-menu').classList.add('hidden');
    });
    document.querySelectorAll('.lang-option').forEach((btn) => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    document.getElementById('btn-favorites-open').addEventListener('click', () => openFavoritesDrawer());
    document.getElementById('favorites-close').addEventListener('click', closeFavoritesDrawer);
    document.getElementById('favorites-backdrop').addEventListener('click', closeFavoritesDrawer);
    document.getElementById('menu-my-favorites').addEventListener('click', () => {
      document.getElementById('user-menu').classList.add('hidden');
      openFavoritesDrawer();
    });

    document.getElementById('btn-login').addEventListener('click', () => {
      setAuthMode('login');
      openModal('modal-auth');
    });
    document.getElementById('btn-avatar').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('user-menu').classList.toggle('hidden');
      document.getElementById('lang-popover').classList.add('hidden');
    });
    function setAuthMode(mode) {
      appMeta.authMode = mode === 'register' ? 'register' : 'login';
      const isReg = appMeta.authMode === 'register';
      document.getElementById('auth-modal-title').textContent = isReg ? t('register') : t('login');
      document.getElementById('btn-switch-register').textContent = isReg ? t('switchLogin') : t('switchRegister');
      document.getElementById('auth-confirm-wrap').classList.toggle('hidden', !isReg);
      const confirmInput = document.querySelector('#form-auth [name="confirmPassword"]');
      if (confirmInput) confirmInput.required = isReg;
    }

    function mapAuthError(error, mode = 'login') {
      const msg = String(error?.message || error || '').toLowerCase();
      const code = String(error?.code || '').toLowerCase();
      if (msg.includes('email not confirmed') || code === 'email_not_confirmed') return t('emailNotConfirmed');
      if (mode === 'login' && (msg.includes('invalid login credentials') || code === 'invalid_credentials')) {
        return t('authLoginFailed');
      }
      if (msg.includes('user already registered') || msg.includes('already been registered')) return t('authExists');
      return error?.message || String(error);
    }

    document.getElementById('btn-switch-register').addEventListener('click', () => {
      setAuthMode(appMeta.authMode === 'login' ? 'register' : 'login');
    });
    document.getElementById('form-auth').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!SUPABASE) { alert(t('loadFailed')); return; }
      const f = e.target;
      const email = f.email.value.trim().toLowerCase();
      const password = f.password.value;
      const nickname = f.nickname.value.trim() || email.split('@')[0];
      if (!isValidEmail(email)) { alert(t('invalidEmail')); return; }
      if (password.length < 8) { alert(t('passwordTooShort')); return; }
      if (appMeta.authMode === 'register') {
        const confirm = f.confirmPassword?.value || '';
        if (password !== confirm) { alert(t('passwordMismatch')); return; }
      }
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        if (appMeta.authMode === 'register') {
          const { data, error } = await SUPABASE.auth.signUp({
            email,
            password,
            options: {
              data: { nickname },
              emailRedirectTo: window.location.origin + '/',
            },
          });
          if (error) throw error;
          if (data.user?.identities?.length === 0) {
            throw new Error(t('authExists'));
          }
          if (data.session) {
            closeModal('modal-auth');
            return;
          }
          alert(t('registerCheckEmail'));
          setAuthMode('login');
        } else {
          const { error } = await SUPABASE.auth.signInWithPassword({ email, password });
          if (error) throw new Error(mapAuthError(error, 'login'));
          closeModal('modal-auth');
        }
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('login'); }
      }
    });
    document.getElementById('menu-logout').addEventListener('click', async () => {
      if (SUPABASE) await SUPABASE.auth.signOut();
      document.getElementById('user-menu').classList.add('hidden');
    });

    function fillSettingsForm() {
      const f = document.getElementById('form-settings');
      if (!f) return;
      const nickname = appMeta.user?.nickname || '';
      const avatarUrl = appMeta.user?.avatar || '';
      f.nickname.value = nickname;
      f.avatarUrl.value = avatarUrl;
      document.getElementById('settings-avatar-preview').src = avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || 'user')}`;
    }

    document.getElementById('menu-settings').addEventListener('click', () => {
      document.getElementById('user-menu').classList.add('hidden');
      if (!requireAuth()) return;
      fillSettingsForm();
      openModal('modal-settings');
    });

    function isValidHttpUrl(raw) {
      if (!raw) return true;
      try {
        const u = new URL(String(raw));
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    async function saveSettings(nickname, avatarUrl) {
      if (!SUPABASE || !authSession?.user?.id) throw new Error('NOT_AUTHENTICATED');
      const userId = authSession.user.id;
      const payload = {
        id: userId,
        nickname: nickname || null,
        avatar_url: avatarUrl || null,
        updated_at: new Date().toISOString(),
      };
      const { error } = await SUPABASE.from('profiles').upsert(payload);
      if (error) throw error;
      if (nickname) appMeta.user.nickname = nickname;
      if (avatarUrl) appMeta.user.avatar = avatarUrl;
      if (!avatarUrl) {
        appMeta.user.avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || userId)}`;
      }
      updateUserUI();
    }

    document.getElementById('form-settings').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requireAuth()) return;
      const f = e.target;
      const nickname = (f.nickname.value || '').trim();
      const avatarUrl = (f.avatarUrl.value || '').trim();
      if (!nickname) { alert(appMeta.lang === 'en' ? 'Nickname is required.' : '昵称不能为空。'); return; }
      if (!isValidHttpUrl(avatarUrl)) { alert(appMeta.lang === 'en' ? 'Avatar URL must be http(s).' : '头像链接必须是 http/https URL。'); return; }
      const submitBtn = f.querySelector('button[type="submit"]');
      const prevLabel = submitBtn?.textContent;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('saving'); }
      try {
        await saveSettings(nickname, avatarUrl);
        closeModal('modal-settings');
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = prevLabel || t('save'); }
      }
    });

    document.getElementById('form-settings').avatarUrl?.addEventListener?.('input', (e) => {
      const v = String(e.target.value || '').trim();
      const preview = document.getElementById('settings-avatar-preview');
      if (!preview) return;
      preview.src = v || (appMeta.user?.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(appMeta.user?.email || 'user')}`);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#user-area')) document.getElementById('user-menu').classList.add('hidden');
      if (!e.target.closest('#btn-lang') && !e.target.closest('#lang-popover')) document.getElementById('lang-popover').classList.add('hidden');
    });

    ['modal-kol', 'modal-gallery', 'modal-auth', 'modal-settings'].forEach((id) => {
      const m = document.getElementById(id);
      if (m) m.addEventListener('click', (e) => { if (e.target === m && !window.getSelection().toString().trim()) closeModal(id); });
    });
    document.querySelectorAll('.modal-close').forEach((b) => {
      if (!b.dataset.modal) return;
      b.addEventListener('click', () => closeModal(b.dataset.modal));
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeModal('modal-kol');
        closeModal('modal-gallery');
        closeModal('modal-auth');
        closeModal('modal-settings');
        closeFavoritesDrawer();
        document.getElementById('user-menu').classList.add('hidden');
        document.getElementById('lang-popover').classList.add('hidden');
      }
    });

    async function bootstrap() {
      initImageDropZones();
      loadMeta();
      switchSubheader('kol');
      document.getElementById('global-search').value = state.searchQuery || '';
      await initAuth();
      toggleUploadButtons(hasSupabaseSession());
      try {
        await fetchAllPosts();
        applyI18n();
      } catch (err) {
        console.error(err);
        alert(t('loadFailed') + '\n' + (err.message || ''));
        applyI18n();
      }
    }

    bootstrap();
  </script>
</body>
</html>
